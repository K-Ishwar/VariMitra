<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VariMitra - Login</title>
    <link rel="stylesheet" href="CSS/style.css">
    <style>
        body {
            background: radial-gradient(circle, var(--night-2) 0%, var(--night) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .lang-container {
            position: absolute;
            top: 24px;
            right: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            margin: 16px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--sage);
            margin-top: 8px;
            margin-bottom: 24px;
            line-height: 1.5;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 8px;
        }
        .register-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 14px;
            color: var(--night);
            text-decoration: none;
            font-weight: 600;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="lang-container">
        <div class="langtoggle">
            <button id="btnEN" class="active">EN</button>
            <button id="btnMR">MR</button>
        </div>
    </div>

    <div class="card login-card">
        <div class="wordmark" style="font-size: 32px;">Vari<span>Mitra</span></div>
        <div class="subtitle" data-i18n="auth_subtitle">Pilgrimage Management System</div>
        
        <form onsubmit="window.handleLogin(event)">
            <div class="form-group">
                <label for="username" data-i18n="auth_username">Username</label>
                <input type="text" id="username" class="input-field" placeholder="Username" data-i18n-placeholder="auth_username" required>
            </div>
            
            <div class="form-group">
                <label for="loginPass" data-i18n="auth_pass">Password</label>
                <input type="password" id="loginPass" class="input-field" placeholder="Password" data-i18n-placeholder="auth_pass" required>
            </div>
            
            <button type="submit" class="btn-primary submit-btn" data-i18n="auth_login_btn">Login</button>
        </form>
        
        <a href="register.html" class="register-link" data-i18n="auth_reg_link">New User? Register Here</a>
    </div>

    <script>
        // Dummy handleLogin to prevent form from submitting natively
        window.handleLogin = function(event) {
            event.preventDefault();
            console.log("Login attempted");
        }
    </script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
